  # ---- P3 India leaves, ids 167-168 ----
  #
  # Two, not the twelve the brief listed, and the difference is the finding.
  #
  # Seven already exist under other names: `autorickshaw` is 6, `e_rickshaw` is 9, `share_auto` is
  # `shared_auto` 51, `tractor_trolley` is 142, `water_tanker` is 20, `handcart`/`vendor_cart` are
  # `push_cart` 40 and `vendor_handcart` 146, and `head_load_carrier` is `person_carrying_load` 75. Adding
  # them again is how 48,322 objects ended up in `traffic_sign`: two names for one thing and a corpus split
  # across both with no way to merge it afterwards. They are aliases below instead.
  #
  # `construction_vehicle` would have sat on top of five classes that already exist - `excavator` 113,
  # `road_roller` 112, `crane_truck` 60, `cement_mixer` 59, `dumper` 61 - which between them hold 76
  # objects. An umbrella over five starved siblings gives an annotator six defensible answers for one
  # machine. `jcb` and `backhoe` are aliases of `excavator`.
  #
  # `city_bus` and `intercity_bus` are the `sedan` mistake, and this file already documents it forty lines
  # up: 94.3% of four-wheelers are labelled `sedan` because a plausible superclass absorbs its siblings.
  # `bus` holds 19,948 objects against `school_bus`'s 1,173. Splitting it leaves 19,948 objects meaning
  # "some bus" forever and every new label going wherever the annotator leans. The city/intercity
  # distinction is real and it is planning-relevant, so it is the `bus_service` attribute instead - the
  # same answer this file already reached for body style.
  #
  # L1 heavy. Distinct silhouettes with nothing already covering them. `tempo` 63 is the goods carrier;
  # a tempo traveller is a twelve-seat passenger van, which is why `tempo` is not an alias here.
  - { id: 167, name: tempo_traveller,  l0: object,  l1: heavy, india: true, aliases: [force_traveller, minibus_van, twelve_seater] }
  - { id: 168, name: school_van,       l0: object,  l1: heavy, india: true, aliases: [school_cab, school_omni] }

  # ---- P3 infrastructure and hazards, ids 169-178 ----
  #
  # Ten, and again the count is the finding. The surface and infra space already holds 75 classes, so most
  # of the brief's list resolved to something present: `open_drain` is `drain` 152, `kerb` is `curb` 101,
  # `footpath` is `sidewalk` 102, `tree_branch` is `fallen_tree` 115, `police_barricade` is `temp_barricade`
  # 39, and the whole construction fleet is 59-61 and 112-113.
  #
  # Two more were attributes rather than classes. `unmarked_speed_breaker` is `speed_breaker` 43 with
  # `marking_state: absent`, which the boundary scope has offered since P1 - and an unpainted breaker is
  # exactly what that attribute was for. `broken_down_vehicle` is a vehicle with `motion: stopped`, not a
  # new kind of object.
  #
  # L0 INFRA / L1 temporary: the surface defects, absent entirely until now. `pothole` was not in a
  # 166-class India ontology, which is the single most surprising thing the audit turned up.
  - { id: 169, name: pothole,          l0: infra,   l1: temporary, india: true, aliases: [road_hole, crater] }
  - { id: 170, name: manhole,          l0: infra,   l1: temporary, india: false, aliases: [manhole_cover, inspection_chamber] }
  # Separate from `manhole` because the two need opposite responses: a raised cover is a jolt, and an open
  # one is a wheel-swallowing hole that has killed riders.
  - { id: 171, name: open_manhole,     l0: infra,   l1: temporary, india: true, aliases: [uncovered_manhole, open_chamber] }
  # A utility trench cut across the carriageway and backfilled unevenly. Distinct from `excavation_pit` 109,
  # which is a pit beside the road rather than a ridge across it.
  - { id: 172, name: road_cut,         l0: infra,   l1: temporary, india: true, aliases: [utility_trench, road_trench] }
  # Vinyl and cloth banners strung across or beside the road. Not `hoarding` 122, which is a permanent
  # structure: a flex banner is put up for a week, sags into the carriageway, and blocks sightlines.
  - { id: 173, name: flex_banner,      l0: infra,   l1: temporary, india: true, aliases: [flex_board, cloth_banner, festival_banner] }
  # L0 INFRA / L1 fixed
  #
  # `road_text` is a region carrying writing, with a `script` attribute and NO text field. There is no OCR
  # model behind this and there is not going to be one: what a detector needs to know is that this corpus is
  # full of signage in scripts its training data never contained, and that is answerable without
  # transcribing a word. Transcription is also the point at which a road dataset starts collecting the
  # contents of shopfronts and number plates, which is a different thing to be building.
  - { id: 174, name: road_text,        l0: infra,   l1: fixed, india: true, aliases: [signage_text, painted_text, lettering] }
  - { id: 175, name: bollard,          l0: infra,   l1: fixed, india: false, aliases: [post_bollard, traffic_bollard] }
  - { id: 176, name: level_crossing,   l0: infra,   l1: fixed, india: false, aliases: [rail_crossing, railway_gate] }
  # L0 SURFACE
  #
  # The break in a median where traffic turns across the carriageway. A planning feature nothing in the
  # boundary set covers, and the place where most of an arterial's conflicts happen.
  - { id: 177, name: median_gap,       l0: surface, l1: boundary, india: true, aliases: [median_opening, u_turn_gap] }
  - { id: 178, name: traffic_island,   l0: surface, l1: non_drivable, india: false, aliases: [refuge_island, pedestrian_island] }
