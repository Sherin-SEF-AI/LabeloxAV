version: "labelox-in-0.2.0"   # ids 1-45 frozen; 46-150 P2 long-tail; 167-168 P3 India (all additive)
hierarchy_levels: 4
attributes:
  occlusion:      { type: enum, values: [0, 25, 50, 75, 100] }
  truncation:     { type: float, range: [0.0, 1.0] }
  direction:      { type: enum, values: [same, cross, wrong_way] }
  helmet:         { type: bool_array }          # per rider
  passenger_load: { type: int, range: [0, 12] }   # measured max in corpus is 4
  overload:       { type: bool }
  on_shoulder:    { type: bool }
  marking_state:  { type: enum, values: [present, faded, absent] }
  blocks_lane:    { type: bool }
  static:         { type: bool }
  articulated:    { type: bool }
  signal_state:   { type: enum, values: [R, Y, G, "off"] }
  livery:         { type: bool }
  # ---- P2 behavioral attributes: dynamic per-object state for planning + prediction. Global like the
  # rest; annotators fill the ones relevant to the object's class (vehicles get motion/brake/indicator,
  # signals get signal_arrow/kind/mount, etc). YAML-boolean words (on/off/none) are quoted so they stay
  # strings. ----
  motion:         { type: enum, values: [moving, stopped, parked, waiting] }
  maneuver:       { type: enum, values: [straight, turning_left, turning_right, u_turn, reversing] }
  brake:          { type: enum, values: ["on", "off"] }
  indicator:      { type: enum, values: ["off", left, right, hazard] }
  lane_position:  { type: enum, values: [ego, left, right, oncoming, opposite] }
  occlusion_pct:  { type: int, range: [0, 100] } # precise occlusion when the bucket is not enough
  # Body style, as an attribute rather than as nine classes.
  #
  # The four_wheeler classes claim to separate sedan, hatchback, SUV, MPV, pickup and the rest. The corpus
  # does not: 134,281 of 142,447 four-wheelers are labelled `sedan`, which is 94.3%, against a hatchback
  # share of 0.3% on roads where the best-selling cars are hatchbacks. `sedan` is functioning as a `car`
  # class that happens to be spelled sedan.
  #
  # A judge good enough to notice makes that visible rather than causing it: re-judging a random 300-crop
  # sample, 128 of its 140 rejections proposed another four-wheeler and only 2 said the label named the
  # wrong kind of thing. That reads as 51% label precision on the strict class and 96% at superclass level.
  #
  # Declared here so the distinction has somewhere to live that is not the class id. Additive on purpose:
  # no class is removed, no object is relabelled, and nothing downstream changes until somebody chooses to
  # populate it. Collapsing the classes or relabelling 142,447 objects is a larger decision and is not this.
  body_style:     { type: enum, values: [sedan, hatchback, suv, mpv, van, pickup, coupe, wagon, unknown] }
  signal_arrow:   { type: enum, values: ["none", left, right, straight, u_turn] }
  signal_kind:    { type: enum, values: [vehicle, pedestrian, cyclist] }
  signal_mount:   { type: enum, values: [pole, gantry, wall, portable] }
  pole_id:        { type: int }                 # id of the pole/structure a signal or sign is mounted on
  # ---- P3 India attributes: what a vehicle is carrying, who is on it, and how it was modified.
  #
  # These are the axes on which Indian road data is distinctive and on which every public AV dataset is
  # silent. A truck with rebar out the back and a scooter with a family of five are both correctly boxed
  # and correctly classed today, and nothing in the record distinguishes either from an empty one. ----
  load_type:      { type: enum, values: ["none", goods, construction_material, agricultural, water, gas_cylinders, livestock, passengers, waste, unknown] }
  load_overhang:  { type: bool }                # load projects past the body outline: rebar, pipes, poles
  cargo_secured:  { type: enum, values: [secured, unsecured, not_applicable, unknown] }
  trailer_attached: { type: bool }
  # Scoped per class, not per l1: l1 `heavy` collapses bus, truck, tractor, tipper, ambulance, fire_truck,
  # bullock_cart and harvester, and an attribute offered on a fire truck is an attribute somebody sets.
  roof_load:          { type: bool }            # goods or people on the roof
  footboard_passengers: { type: bool }          # riding the step outside the doorway
  passengers_on_load: { type: bool }            # people riding on top of the cargo itself
  # Occupancy. The range stops at 6 rather than the 4 the brief proposed: a family of five on a scooter is
  # a real and photographable thing, and a ceiling that refuses to record it turns the observation this
  # attribute exists to capture into a validation error.
  occupant_count: { type: int, range: [0, 6] }
  # Read from occupant_count, never written. Two independently settable fields produce objects that say
  # three occupants and not triple riding, and no consumer can tell which one to believe.
  triple_riding:  { type: bool, derived_from: occupant_count }
  delivery_box:   { type: bool }                # the brief is right that this is an attribute, not a class
  rain_gear:      { type: enum, values: ["none", poncho, umbrella, raincoat, unknown] }
  head_load:      { type: bool }                # carrying on the head, hands free
  mobility_aid:   { type: enum, values: ["none", crutches, wheelchair, walking_stick, unknown] }
  animal_control: { type: enum, values: [herded, tethered, stray, unknown] }
  group_size:     { type: int, range: [1, 50] } # a herd or a crowd boxed as one; 1 means a single animal
  modified_body:  { type: bool }                # rebuilt or extended beyond the factory body
  # What the bus is for, as an attribute rather than as three classes, for the reason recorded against the
  # P3 leaves below. A city bus stops in the running lane every few hundred metres, an intercity coach does
  # not stop at all, and a school service stops and unloads children into the road. That is the planning
  # distinction, and it is worth having without splitting a class that already holds 19,948 objects.
  bus_service:    { type: enum, values: [city, intercity, school, staff, tourist, unknown] }

# Per-subclass (L1) applicable-attribute allowlist. An object's class restricts which global attributes
# apply, so the editor shows only the relevant ones and validation rejects the rest. A subclass not listed
# here means all attributes apply (backward compatible).
attribute_scope:
  two_wheeler:   [occlusion, occlusion_pct, truncation, direction, motion, maneuver, brake, indicator, lane_position, helmet, passenger_load, overload, static, occupant_count, triple_riding, delivery_box, rain_gear, load_overhang, modified_body]
  three_wheeler: [occlusion, occlusion_pct, truncation, direction, motion, maneuver, brake, indicator, lane_position, passenger_load, overload, livery, static, occupant_count, triple_riding, load_type, load_overhang, cargo_secured, modified_body]
  four_wheeler:  [occlusion, occlusion_pct, truncation, direction, motion, maneuver, brake, indicator, lane_position, livery, static, body_style, load_type, load_overhang, cargo_secured, trailer_attached, modified_body]
  heavy:         [occlusion, occlusion_pct, truncation, direction, motion, maneuver, brake, indicator, lane_position, articulated, overload, livery, static, load_type, load_overhang, cargo_secured, trailer_attached, modified_body]
  vru:           [occlusion, occlusion_pct, truncation, direction, motion, lane_position, on_shoulder, helmet, rain_gear, head_load, mobility_aid, group_size]
  animal:        [occlusion, occlusion_pct, truncation, motion, on_shoulder, static, animal_control, group_size]
  fixed:         [occlusion, truncation, signal_state, signal_arrow, signal_kind, signal_mount, marking_state, blocks_lane, static, pole_id]
  temporary:     [occlusion, truncation, blocks_lane, static, on_shoulder]
  boundary:      [occlusion, truncation, marking_state, blocks_lane]

# Per-CLASS extras, unioned onto whatever the l1 scope above allows. Only for attributes l1 cannot express.
#
# `heavy` holds bus, school_bus, truck, tractor, tipper, ambulance, fire_truck, bullock_cart and harvester
# in one bucket, so "buses" and "things carrying cargo" are not sayable at l1. A class listed here keeps its
# l1 attributes and gains these; a class absent behaves exactly as it did before this key existed.
attribute_scope_class:
  bus:              [footboard_passengers, roof_load, bus_service]
  school_bus:       [footboard_passengers, bus_service]
  tempo_traveller:  [footboard_passengers, roof_load, bus_service]
  school_van:       [footboard_passengers, bus_service]
  shared_auto:      [footboard_passengers]
  autorickshaw:     [footboard_passengers]
  truck:            [roof_load, passengers_on_load]
  tipper:           [passengers_on_load]
  tractor_trolley:  [passengers_on_load, roof_load]
  goods_3w:         [passengers_on_load]
  bullock_cart:     [passengers_on_load]

