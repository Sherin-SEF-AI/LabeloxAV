# LabeloxSec domain pack manifest (human-facing; the code manifest in pack.py is the source of truth and the
# registry checks the two agree). India CCTV / security footage. See docs/PACK_INTERFACE.md.
id: sec
display_name: "Security / CCTV (India)"
version: "0.1.0"
default_scene_model: static_camera
capabilities:
  - static_camera
  - background_prior
  - privacy_redaction
  - anpr
  # Scene analytics and cross-camera linking. Declared here and nowhere else: the AV pack must not be able
  # to draw a tripwire on a dashcam or follow a pedestrian between vehicles, which is what the privacy
  # plane exists to prevent.
  - zones
  - reid
  - rtsp
ontology: ontology/sec/labelox_sec_v0.yaml
