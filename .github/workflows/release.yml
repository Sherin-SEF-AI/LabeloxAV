name: Release

# A tag of the form v<version> builds the Debian package and publishes a GitHub release with it attached.
# The tag must match the version in pyproject.toml, so a release cannot claim to be a version the code
# does not say it is. Release notes are a file committed beside the packaging, so they are reviewed in a
# pull request like everything else rather than typed into a form at the last moment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag names the version the code carries
        run: |
          v="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          test "$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject says $v" >&2; exit 1; }

      # Every image a fresh install pulls has to exist. MinIO withdrew its Docker Hub repositories and
      # v0.1.0 shipped pointing at them; the machine it was built on had cached copies, so nothing noticed.
      - name: Every pulled image still resolves
        run: python3 -m pip install -q pyyaml && python3 scripts/check_images.py

      - name: Build and check the package
        run: ./scripts/build_deb.sh --check

      # The package is installed into a clean Debian container, with dependencies forced past because
      # Docker cannot run inside this runner's container, and then removed again. It proves the archive
      # unpacks, the maintainer scripts run, the launcher executes, and removal leaves nothing behind.
      - name: Install the package into a clean container
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:bookworm-slim bash -euxc '
            dpkg -i --force-depends /dist/*.deb
            test -x /usr/bin/labeloxav
            labeloxav version
            labeloxav url
            test -f /opt/labeloxav/scripts/install.sh
            dpkg -r labeloxav
            test ! -e /usr/bin/labeloxav
          '

      # The test that would have stopped both v0.1.0 defects. Installing the package and running its
      # launcher, which the step above does, passed for a package that could not finish installing: the
      # image build failed on a missing licence file, and after that the MinIO images no longer existed
      # on Docker Hub. Only bringing the whole product up from the package catches either. The runner
      # has Docker from GitHub's own packages rather than docker.io or docker-ce, so the package's
      # dependency line is satisfied by what is already installed; apt resolution of that line was
      # verified separately on a clean Ubuntu 24.04.
      - name: Install the package on this runner and bring the product up
        run: |
          sudo dpkg -i --force-depends dist/*.deb
          sudo labeloxav install
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8000/api/health)" = 200 ] && break
            sleep 5
          done
          curl -fsS --max-time 10 http://localhost:8000/api/health
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 http://localhost:3000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:8000/api/sessions)" = 401
          tok="$(sudo grep -o 'lbx2\.[A-Za-z0-9._-]*' /opt/labeloxav/.admin-token | head -1)"
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H "Authorization: Bearer $tok" http://localhost:8000/api/sessions)" = 200
          sudo labeloxav down

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="packaging/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.deb --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb --title "$GITHUB_REF_NAME" --generate-notes
          fi
