name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# One run per ref; cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and security scans run first and gate the (slower, infra-heavy) test job: a formatting slip, a
  # committed secret, or an obviously unsafe call fails in ~1 min instead of after the full suite spins up
  # Postgres/MinIO/Redpanda.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks scans full history, not just the tip commit

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Create venv + install dev deps (no GPU wheels)
        run: make install

      - name: Secret scan (gitleaks, blocking)
        # The one hard gate here: a committed credential must never reach a branch. Scans full history.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every image a fresh install pulls has to exist. This ran only at release time, so when quay.io began
      # refusing anonymous pulls of MinIO every pull request's test job failed before a test ran, and nothing
      # said why. Built images (MinIO, Postgres, the app) are not checked: they come from this repository.
      - name: Every pulled image still resolves (blocking)
        run: .venv/bin/python scripts/check_images.py

      - name: Import contract (import-linter, blocking)
        # The engine core (core, services, db) must not statically import a concrete domain pack; the only
        # bridge is packs.registry. This is a structural invariant of the multi-domain refactor, so it gates.
        run: .venv/bin/lint-imports

      - name: Ruff (blocking, whole tree)
        # The whole tree, and it gates. It used to block on nine paths and report the rest, on the reasoning
        # that a gate which starts red is a gate nobody turns on. The debt behind that was 135 findings; they
        # are fixed, so the ratchet is no longer needed and a lint regression anywhere fails the build.
        # B008 (FastAPI Depends in defaults) is configured off in pyproject for the API layer, since it is
        # the framework idiom, not a bug.
        run: .venv/bin/ruff check .

      - name: Type check (mypy strict, blocking allowlist)
        # A strict-typing ratchet seeded with the new security and measurement code. These modules are
        # fully annotated under --strict; grow the allowlist as more of the tree is typed. Blocking, so a
        # type regression in this critical code fails the build.
        run: >
          .venv/bin/mypy --strict --ignore-missing-imports
          core/accel/ap.py core/accel/recapture.py core/version.py core/timebase.py
          services/api/auth_token.py services/review_policy.py
          services/anonymize/coverage.py services/training/lineage.py
          core/model_manager.py services/job_lock.py services/llm/ledger.py services/api/offload.py

      - name: Dependency audit (blocking on new advisories)
        # `pip-audit --strict || true` was the step, and it could not fail: --strict tries to look the
        # project itself up on PyPI. The pins carried 159 advisories by the time anybody looked. The script
        # fails on any advisory not in configs/pip_audit_baseline.txt, so a new pin or a newly published
        # advisory blocks, while the known backlog is worked down upgrade by upgrade.
        run: |
          uv pip install --python .venv/bin/python pip-audit==2.10.1
          .venv/bin/python scripts/audit_deps.py

      - name: Static security scan (bandit, blocking at high severity)
        # High severity at medium confidence or better is clean today, so it gates. The medium and low
        # findings (asserts, subprocess with fixed arguments, try/except/pass) are printed for reading and
        # do not gate: most are judgement calls, and a gate that argues with every assert gets switched off.
        run: |
          uv pip install --python .venv/bin/python bandit==1.9.4
          .venv/bin/bandit -q -r services core db -x tests --severity-level high --confidence-level medium
          .venv/bin/bandit -q -r services core db -x tests --severity-level medium || true

      - name: Type check (mypy)
        # Informational while the tree is annotated incrementally; surfaces regressions without gating.
        continue-on-error: true
        run: .venv/bin/mypy services core db packs --ignore-missing-imports || true

  # The web frontend typechecks and builds independently of the Python backend and infra, so it runs in
  # parallel with the test job. A type error or a broken production build (for example a useSearchParams call
  # not wrapped in a Suspense boundary, which fails the static prerender) gates the merge here.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps (clean, from the lockfile)
        run: npm ci

      - name: Typecheck (tsc --noEmit, blocking)
        run: npx tsc --noEmit

      - name: ESLint (blocking on errors)
        # The repo carried a "lint" script with no linter installed to run it, so nothing on the frontend was
        # ever checked beyond types. Errors block. The hook-dependency findings are warnings for now because
        # each one needs reading rather than a bulk edit, and a gate that starts red is a gate nobody turns on.
        run: npx next lint

      - name: Unit floor + component render tests (vitest, blocking)
        # Two tiers: pure logic in node, components in jsdom. There was no render tier at all - the config
        # was environment "node" with an include of *.test.ts, so a .test.tsx was never collected and 79
        # components had zero coverage that nobody could see was missing.
        #
        # Run with coverage so the ratchet in vitest.config.ts gates: it is set just under the measured
        # numbers, so a drop fails the build rather than a gap sitting red until somebody deletes it.
        run: npm run test:coverage

      - name: Production build (next build, blocking)
        run: npm run build

      # (The editor and frame-lock end-to-end suite does run, in the test job below, where the
      # infrastructure it needs is already up.)
      # The e2e smoke needs the API, a migrated database and the web server all up. Standing that whole
      # stack up here would roughly double this job and gate every frontend PR on infra it does not
      # otherwise need, so it is not run in CI today. It runs locally with `make e2e` and skips cleanly
      # when nothing is serving. Stated rather than left as a silent omission: a suite nobody runs is the
      # same as no suite, and pretending otherwise is how the last one ended up installed and uninvoked.

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Create venv + install dev deps (no GPU wheels)
        run: make install

      # CPU torch + imagehash so the suite actually runs the accel/embedding/dedup paths in CI instead of
      # erroring on a missing import. The runner has no GPU, so the CUDA (cu128) wheels the ml extra pins are
      # wrong here; the CPU wheel satisfies `import torch` and the modules that only check torch is present.
      # `uv` comes from setup-uv and lives on PATH; it is never installed into the venv, so `.venv/bin/uv`
      # has never existed. This step therefore exited 127 before pytest was ever reached, which meant the
      # test job had not run at all across every red build on this branch. --python points uv at the venv
      # it should install into, which is what the old path was trying to express.
      - name: Install CPU torch + imagehash for the test suite
        run: |
          uv pip install --python .venv/bin/python torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python imagehash==4.3.1
          # ultralytics lives in the `ml` extra, which CI does not install, so the plate weight fetched
          # below landed in an environment that could not load it: every run logged
          # `pii.plate_detector_load_failed: No module named 'ultralytics'` and the plate half of the DPDPA
          # gate went unexercised on the machine that gates merges - the same hole the comment below is
          # about, one detector over. Installed after CPU torch so it resolves against that rather than
          # dragging in the CUDA wheel the ml extra pins.
          uv pip install --python .venv/bin/python ultralytics==8.3.0

      # The PII weights are 5.5 MB total (a 228 KB YuNet face model and a 5.3 MB plate model) and they are
      # what makes the DPDPA gate testable. Without them the anonymizer refuses to construct, by design, and
      # ingest fails: the one control that keeps unredacted faces out of the object store would go untested
      # on the machine that gates merges, which is the worst place to skip it.
      - name: Fetch the PII detector weights so the DPDPA gate is exercised
        run: make pii-models

      - name: Start infra (postgis+pgvector, minio, redis, redpanda)
        run: make up

      - name: Run the suite against an isolated test database
        # conftest.py provisions labeloxav_test and refuses any non-test db, so CI never touches a real
        # corpus. This is the durable guard against the test-pollution that corrupted the dev database.
        env:
          LBX_POSTGRES__DB: labeloxav_test
        run: make test

      # The editor in a real browser, on the infrastructure the suite above just used. The web job says
      # why the older e2e smoke is not run in CI: it needs a whole deployed stack. This one does not. It
      # builds its own database, seeds ten synthetic frames and three users, starts the API and the web
      # app on free ports, and removes all of it (scripts/e2e_editor.sh): no GPU, no model weights, no
      # network. What it checks cannot be checked any other way: that a nudge is saved, that a paste on
      # another frame lands, that a second person is view-only and the server refuses their save.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Editor and frame-lock end to end (Playwright, blocking)
        run: |
          cd web && npm ci && npx playwright install --with-deps chromium && cd ..
          make e2e-editor

      - name: Infra logs on failure
        if: failure()
        run: docker compose logs --tail=80 postgres minio redis
