name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# One run per ref; cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and security scans run first and gate the (slower, infra-heavy) test job: a formatting slip, a
  # committed secret, or an obviously unsafe call fails in ~1 min instead of after the full suite spins up
  # Postgres/MinIO/Redpanda.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks scans full history, not just the tip commit

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv + install dev deps (no GPU wheels)
        run: make install

      - name: Secret scan (gitleaks, blocking)
        # The one hard gate here: a committed credential must never reach a branch. Scans full history.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ruff
        # Informational: the tree carries pre-existing lint debt, so ruff reports without gating (fix forward).
        continue-on-error: true
        run: .venv/bin/ruff check .

      - name: Dependency audit (pip-audit)
        # Informational: a new advisory should not block an unrelated PR, but it must be visible in the log.
        continue-on-error: true
        run: .venv/bin/python -m pip install pip-audit && .venv/bin/pip-audit --strict || true

      - name: Static security scan (bandit)
        continue-on-error: true
        run: .venv/bin/python -m pip install bandit && .venv/bin/bandit -q -r services core db -x tests || true

      - name: Type check (mypy)
        # Informational while the tree is annotated incrementally; surfaces regressions without gating.
        continue-on-error: true
        run: .venv/bin/mypy services core db --ignore-missing-imports || true

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv + install dev deps (no GPU wheels)
        run: make install

      - name: Start infra (postgis+pgvector, minio, redis, redpanda)
        run: make up

      - name: Run the suite against an isolated test database
        # conftest.py provisions labeloxav_test and refuses any non-test db, so CI never touches a real
        # corpus. This is the durable guard against the test-pollution that corrupted the dev database.
        env:
          LBX_POSTGRES__DB: labeloxav_test
        run: make test

      - name: Infra logs on failure
        if: failure()
        run: docker compose logs --tail=80 postgres minio redis
