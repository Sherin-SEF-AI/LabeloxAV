name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# One run per ref; cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and security scans run first and gate the (slower, infra-heavy) test job: a formatting slip, a
  # committed secret, or an obviously unsafe call fails in ~1 min instead of after the full suite spins up
  # Postgres/MinIO/Redpanda.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks scans full history, not just the tip commit

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv + install dev deps (no GPU wheels)
        run: make install

      - name: Secret scan (gitleaks, blocking)
        # The one hard gate here: a committed credential must never reach a branch. Scans full history.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import contract (import-linter, blocking)
        # The engine core (core, services, db) must not statically import a concrete domain pack; the only
        # bridge is packs.registry. This is a structural invariant of the multi-domain refactor, so it gates.
        run: .venv/bin/lint-imports

      - name: Ruff (blocking on the security/measurement modules)
        # A ratchet: the modules the remediation touched must stay clean, so a lint regression there fails the
        # build. The rest of the tree still carries pre-existing debt and is reported (not gated) below, fixed
        # forward. B008 (FastAPI Depends in defaults) is configured off in pyproject for the API layer, since
        # it is the framework idiom, not a bug.
        run: >
          .venv/bin/ruff check
          core/accel core/version.py services/verdyx
          services/api/main.py services/api/deps.py services/api/auth_token.py
          services/api/routers/predictions.py services/analytics/evaluation.py

      - name: Ruff (informational, whole tree)
        # Reports the remaining pre-existing debt without gating an unrelated PR. Fix forward and grow the
        # blocking set above as directories are cleaned.
        continue-on-error: true
        run: .venv/bin/ruff check .

      - name: Type check (mypy strict, blocking allowlist)
        # A strict-typing ratchet seeded with the new security and measurement code. These modules are
        # fully annotated under --strict; grow the allowlist as more of the tree is typed. Blocking, so a
        # type regression in this critical code fails the build.
        run: >
          .venv/bin/mypy --strict --ignore-missing-imports
          core/accel/ap.py core/version.py services/api/auth_token.py

      - name: Dependency audit (pip-audit)
        # Informational: a new advisory should not block an unrelated PR, but it must be visible in the log.
        continue-on-error: true
        run: .venv/bin/python -m pip install pip-audit && .venv/bin/pip-audit --strict || true

      - name: Static security scan (bandit)
        continue-on-error: true
        run: .venv/bin/python -m pip install bandit && .venv/bin/bandit -q -r services core db -x tests || true

      - name: Type check (mypy)
        # Informational while the tree is annotated incrementally; surfaces regressions without gating.
        continue-on-error: true
        run: .venv/bin/mypy services core db packs --ignore-missing-imports || true

  # The web frontend typechecks and builds independently of the Python backend and infra, so it runs in
  # parallel with the test job. A type error or a broken production build (for example a useSearchParams call
  # not wrapped in a Suspense boundary, which fails the static prerender) gates the merge here.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps (clean, from the lockfile)
        run: npm ci

      - name: Typecheck (tsc --noEmit, blocking)
        run: npx tsc --noEmit

      - name: Production build (next build, blocking)
        run: npm run build

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv + install dev deps (no GPU wheels)
        run: make install

      # CPU torch + imagehash so the suite actually runs the accel/embedding/dedup paths in CI instead of
      # erroring on a missing import. The runner has no GPU, so the CUDA (cu128) wheels the ml extra pins are
      # wrong here; the CPU wheel satisfies `import torch` and the modules that only check torch is present.
      - name: Install CPU torch + imagehash for the test suite
        run: |
          .venv/bin/uv pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/uv pip install imagehash==4.3.1

      - name: Start infra (postgis+pgvector, minio, redis, redpanda)
        run: make up

      - name: Run the suite against an isolated test database
        # conftest.py provisions labeloxav_test and refuses any non-test db, so CI never touches a real
        # corpus. This is the durable guard against the test-pollution that corrupted the dev database.
        env:
          LBX_POSTGRES__DB: labeloxav_test
        run: make test

      - name: Infra logs on failure
        if: failure()
        run: docker compose logs --tail=80 postgres minio redis
