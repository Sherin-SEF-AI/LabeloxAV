name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "scripts/build_docs.py", "services/api/**", ".github/workflows/docs.yml"]
  # So a docs change can be reviewed before it is published.
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "scripts/build_docs.py"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv + install (no GPU wheels)
        run: make install

      - name: Install docs toolchain
        run: VIRTUAL_ENV=.venv uv pip install "mkdocs-material==9.5.49" "mkdocstrings[python]==0.27.0"

      # Regenerated on every build rather than committed, so the published API reference cannot drift from
      # the code. It imports the FastAPI app; no database or object store is touched.
      - name: Generate OpenAPI schema and route inventory
        run: .venv/bin/python -m scripts.build_docs

      # --strict turns a broken internal link into a failed build. The site is the thing people read when
      # they cannot read the code, so a dead link in it is worse than a dead link in a comment.
      - name: Build site
        run: .venv/bin/mkdocs build --strict

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only from main, and only after a strict build. A pull request gets the build check without publishing.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
